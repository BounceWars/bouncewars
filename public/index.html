<style>

*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:10px}
.hidden{display:none!important}
h1{font-size:44px;margin:0;text-align:center;letter-spacing:-1.5px;font-weight:800}
h1 span{color:var(--p0)}
h2{font-size:22px;margin:16px 0 14px;text-align:center}
.c{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:40px;min-height:calc(100dvh - 24px)}
.c h2{margin:0}
.c .menu{width:76%;max-width:340px}
.menu{display:flex;flex-direction:column;gap:12px;max-width:360px;margin:0 auto}
.home{gap:18px}
.menu button,.menu input,.menu select{width:100%;padding:16px}
button,input,select{font:inherit;font-weight:700;font-size:18px;padding:14px 22px;border:0;border-radius:20px;background:var(--red);color:#fff;cursor:pointer}
button.sec{background:var(--s2);color:var(--fg)}
button.play{font-size:34px;padding:26px 10px;border-radius:30px;box-shadow:0 10px 26px rgba(229,72,77,.35)}
.home .sec{font-size:20px}
button:disabled{opacity:.4;cursor:default}
input.t,select{background:var(--surf);color:var(--fg);border:2px solid var(--grid);text-align:center;letter-spacing:3px;cursor:text}
select{cursor:pointer;letter-spacing:0}
input#srv{letter-spacing:0;font-size:14px;font-weight:400}
input[type=range]{padding:0;height:34px;accent-color:var(--p1);background:transparent;border:0}
.lbl{font-size:13px;color:var(--mut);margin:6px 0 -4px;font-weight:700}
#status{white-space:pre-line;font-weight:600;font-size:14px;margin:6px 0;min-height:38px}
canvas{display:block;margin:0 auto;background:var(--surf);border-radius:24px;touch-action:none;border:2px solid var(--grid)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#abil{margin-top:6px}
#abil button.on{background:var(--p1);color:#fff}
.top{display:flex;gap:8px;align-items:center}
.top #status{flex:1;margin:0}
.top button,.row button{font-size:16px;padding:10px 18px;border-radius:16px}
.tabs{display:flex;gap:6px;max-width:360px;margin:0 auto 12px;background:var(--s2);padding:5px;border-radius:22px}
.tabs button{flex:1;background:transparent;color:var(--mut);padding:10px;border-radius:17px;font-size:16px}
.tabs button.on{background:var(--surf);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.shop{display:flex;flex-direction:column;gap:8px;max-width:360px;margin:0 auto}
.sk{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surf);border:2px solid var(--grid);border-radius:20px;color:var(--fg);width:100%;font-size:16px}
.sk i{width:28px;height:28px;border-radius:50%;display:inline-block;flex:none}
.sk .ic{width:34px;height:34px;background:var(--p1);color:#fff;font-size:12px;font-style:normal;display:flex;align-items:center;justify-content:center}
.sk span{flex:1;text-align:left}
.sk em{display:block;font-size:12px;font-style:normal;font-weight:400;color:var(--mut)}
.sk small{display:flex;align-items:center;font-size:14px}
.sk.on{border-color:var(--red)}
.coins{display:flex;justify-content:center;align-items:center;font-size:20px;font-weight:700;margin:0 0 12px}
.coin{width:1.25em;height:1.25em;margin-right:6px;flex:none}
.sk .coin{margin-right:4px}
#code{font-size:40px;font-weight:800;letter-spacing:8px;text-align:center;margin:10px 0}
#onmsg{text-align:center;color:var(--mut);font-size:14px;margin:10px auto;min-height:40px;max-width:360px}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px;margin:0 auto}
.mc{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surf);color:var(--fg);border:2px solid var(--grid);padding:10px 8px;font-size:14px;border-radius:22px}
.mc svg{height:104px;width:auto}
.mc span{line-height:1.15;text-align:center}
#sbwrap{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:20px}
.card{background:var(--surf);border-radius:28px;padding:20px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.card h2{margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{color:var(--mut);font-weight:600;text-align:left;padding:6px 4px;border-bottom:2px solid var(--grid)}
td{padding:8px 4px;border-bottom:1px solid var(--grid)}
tr.tot td{font-weight:800;border-bottom:0;padding-top:12px}
#sbNote{text-align:center;color:var(--mut);font-size:14px;margin:12px 0 0}
</style>
</head>

async function openTransport(code){
  var room=null;
  try{room=window.claude&&await claude.use('room')}catch(e){}
  if(room){
    var r=await room.join('g-'+code.toLowerCase());
    r.on('game',function(m){hm({data:m.data,isMe:m.isMe})},function(){});
    r.onPeers(function(c){hp(c.peers.length)},function(){});
    return {emit:function(d){return r.emit('game',d)},leave:function(){return r.leave()}};
  }
  var url=S.srv||(/^https?:$/.test(location.protocol)&&location.hostname!=='localhost'&&!window.Capacitor?(location.protocol==='https:'?'wss://':'ws://')+location.host:'');
  if(!url)throw new Error('na');
  return new Promise(function(res,rej){
    var ws=new WebSocket(url),id=null,ok=false,t;
    t=setTimeout(function(){if(!ok){try{ws.close()}catch(e){}rej(new Error('jf'))}},8000);
    ws.onopen=function(){ws.send(JSON.stringify({j:code}))};
    ws.onmessage=function(ev){
      var m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.id)id=m.id;
      else if(typeof m.n==='number'){if(!ok){ok=true;clearTimeout(t);res(tx)}hp(m.n)}
      else if(m.d!==undefined)hm({data:m.d,isMe:m.f===id});
    };
    ws.onclose=ws.onerror=function(){if(!ok){clearTimeout(t);rej(new Error('jf'))}else hp(0)};
    var tx={emit:function(d){if(ws.readyState===1)ws.send(JSON.stringify({d:d}));return Promise.resolve()},leave:function(){ws.onclose=null;ws.onerror=null;ws.close()}};
  });
}
async function joinRoom(code,host){
  var msg=$('onmsg');
  mode='online';isHost=host;myIdx=host?0:1;startMsg=null;lastN=0;seq=0;
  msg.textContent=T('conn',code);
  try{tr=await openTransport(code)}
  catch(e){mode=null;tr=null;msg.textContent=T(e&&e.message==='na'?'na':'jf');return}
  $('onlbtns').classList.add('hidden');$('onback').classList.remove('hidden');
  if(host){$('code').textContent=code;$('code').classList.remove('hidden');msg.textContent=T('wait')}
  else{
    var hi=function(){if(tr)tr.emit({t:'hello'}).catch(function(){})};hi();helloT=setInterval(hi,1500);
  }
}
$('mk').onclick=function(){
  var ch='ABCDEFGHJKMNPQRSTUVWXYZ23456789',c='';
  for(var i=0;i<4;i++)c+=ch[Math.floor(Math.random()*ch.length)];
  pendCode=c;pick='online';show('maps');
};
$('jn').onclick=function(){
  var c=$('jc').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(c)){$('onmsg').textContent=T('ec');return}
  joinRoom(c,false);
};

/* ---- render ---- */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(started&&cur==='game'){
  var cs=getComputedStyle(document.documentElement);
  var col=[cs.getPropertyValue('--p0').trim(),cs.getPropertyValue('--p1').trim()];
  var sc=SK[S.skin].c,mi=mode==='local'?0:me();if(sc&&mi>=0)col[mi]=sc;
  var grid=cs.getPropertyValue('--grid').trim(),mut=cs.getPropertyValue('--mut').trim(),fg=cs.getPropertyValue('--fg').trim();
  var s2=cs.getPropertyValue('--s2').trim(),surf=cs.getPropertyValue('--surf').trim();
  var poly=function(pl){ctx.beginPath();pl.forEach(function(q,i){i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath()};
  ctx.fillStyle=s2;ctx.fillRect(0,0,W,H);
  poly(POLY);ctx.fillStyle=surf;ctx.fill();
  ctx.save();ctx.clip();ctx.strokeStyle=grid;ctx.lineWidth=1;
  for(var gx=50;gx<W;gx+=50){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke()}
  for(var gy=50;gy<H;gy+=50){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}
  ctx.restore();
  ctx.lineJoin='round';ctx.strokeStyle=mut;ctx.lineWidth=4;poly(POLY);ctx.stroke();
  bars.forEach(function(b){poly(b);ctx.fillStyle=mut;ctx.fill();ctx.strokeStyle=fg;ctx.lineWidth=2;ctx.stroke()});
  if(trail&&!anim){
    trail.a-=dt*.5;
    if(trail.a>0){ctx.globalAlpha=trail.a*.6;ctx.strokeStyle=col[trail.who];ctx.lineWidth=2;ctx.beginPath();
      trail.pts.forEach(function(p,i){i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.stroke();ctx.globalAlpha=1}
    else trail=null;
  }
  if(anim){
    anim.t+=SPEED*dt;
    var rem=Math.min(anim.t,anim.len),pts=anim.r.pts;
    ctx.strokeStyle=col[anim.shooter];ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    var bounces=0;
    for(var i=1;i<pts.length;i++){
      var l=anim.seg[i-1];
      if(rem>=l){ctx.lineTo(pts[i].x,pts[i].y);rem-=l;if(!(anim.r.hit&&i===pts.length-1))bounces++}
      else{var f=rem/l;ctx.lineTo(pts[i-1].x+(pts[i].x-pts[i-1].x)*f,pts[i-1].y+(pts[i].y-pts[i-1].y)*f);break}
    }
    ctx.stroke();
    bounces=Math.min(bounces,anim.r.b);
    if(bounces>anim.pb){anim.pb=bounces;sfx('bounce');vib(12)}
    ctx.fillStyle=fg;ctx.font='bold 16px system-ui';ctx.fillText(T('bnc',bounces),12,26);
    if(anim.t>=anim.len+60)finish();
  }else if(canControl()){
    var s=P[turn];ctx.strokeStyle=col[turn];ctx.lineWidth=2;ctx.setLineDash([6,8]);
    ctx.beginPath();ctx.moveTo(s.x,s.y);
    if(mode!=='local'&&S.ab.indexOf('aim')>=0){path(s,P[1-turn],ang,2).pts.forEach(function(q,i){if(i)ctx.lineTo(q.x,q.y)})}
    else ctx.lineTo(s.x+Math.cos(ang)*110,s.y+Math.sin(ang)*110);
    ctx.stroke();ctx.setLineDash([]);
  }
  for(var k=0;k<2;k++){
    var p=P[k];
    ctx.globalAlpha=p.hp<=0?.3:1;
    ctx.fillStyle=col[k];ctx.beginPath();ctx.arc(p.x,p.y,R,0,7);ctx.fill();
    if(k===turn&&!over){ctx.strokeStyle=fg;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,R+5,0,7);ctx.stroke()}
    ctx.fillStyle=mut;ctx.fillRect(p.x-25,p.y+R+8,50,6);
    ctx.fillStyle=col[k];ctx.fillRect(p.x-25,p.y+R+8,50*p.hp/HP,6);
    ctx.fillStyle=fg;ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(p.hp+' HP',p.x,p.y+R+28);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
  floats=floats.filter(function(f){return f.t<1.6});
  floats.forEach(function(f){f.t+=dt;ctx.globalAlpha=Math.max(0,1-f.t/1.6);ctx.fillStyle=f.col;ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText(f.txt,f.x,f.y-f.t*30);ctx.globalAlpha=1;ctx.textAlign='left'});
  }
  requestAnimationFrame(frame);
}
applyTheme();applyLang();
requestAnimationFrame(frame);
})();
